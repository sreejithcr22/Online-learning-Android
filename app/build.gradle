apply plugin: 'com.android.application'

android {
    namespace "com.codit.interview.aptitude"
    compileSdk 36

    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }

    signingConfigs {
        release {
            storeFile rootProject.file(localProps.getProperty('storeFile', 'signing/keystore.jks'))
            storePassword localProps.getProperty('storePassword')
            keyAlias localProps.getProperty('keyAlias')
            keyPassword localProps.getProperty('keyPassword')
        }
    }

    defaultConfig {
        applicationId "com.codit.interview.aptitude"
        minSdk 24
        targetSdk 36
        versionCode 32
        versionName "3.0"

        vectorDrawables {
            useSupportLibrary true
        }
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation files('libs/achartengine-1.2.0.jar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'io.github.dinuscxj:circleprogressbar:1.4.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
}
